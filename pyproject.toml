[project]
name = "oracle-manager"
version = "0.1.1"
description = "用於管理資料庫的工具平台，提供連線測試、SQL 執行、資料庫監控等功能。"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django==2.2.28",
    "gunicorn==19.10.0",
    "oracledb==2.1.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = [
    "data-analysis",
]
